apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-sales
  namespace: ecommerce
spec:
  serviceName: postgres-sales
  replicas: 1
  selector:
    matchLabels:
      app: postgres-sales
  template:
    metadata:
      labels:
        app: postgres-sales
        tier: postgres
    spec:
      # Image postgres resmi berjalan sebagai uid/gid 999; fsGroup membuat
      # proses bisa menulis ke volume PGDATA.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: ec_sales
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ec_sales"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ec_sales"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-sales
  namespace: ecommerce
spec:
  # Headless: alamat stabil postgres-sales.ecommerce.svc.cluster.local untuk PgBouncer.
  clusterIP: None
  selector:
    app: postgres-sales
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
