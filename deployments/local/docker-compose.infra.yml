# docker-compose.infra.yml — Infra-only stack for running Go services locally.
#
# Runs ONLY the infrastructure:
#   Six PostgreSQL instances + six PgBouncer poolers (1 database = 1 bounded
#   context), Redis, Kafka (KRaft), ClickHouse, and optional observability tools.
#
# The Go services are NOT part of this compose file — they are started
# locally via `go run service/<name>/cmd/main.go`.
#
# Usage:
#   docker compose -f deployments/local/docker-compose.infra.yml up -d
#   docker compose -f deployments/local/docker-compose.infra.yml down
#   docker compose -f deployments/local/docker-compose.infra.yml --profile monitoring up -d

name: ecommerce-infra

services:
  # 1 database = 1 PostgreSQL instance, masing-masing di-front PgBouncer
  # (session pool) sendiri. Tidak ada instance/database shared. Port host pooler
  # 6432-6437 dipakai service yang dijalankan di HOST lewat DB_<CONTEXT>_HOST /
  # _PORT / _NAME di .env root.
  postgres_identity:
    image: postgres:17-alpine
    container_name: ecommerce-postgres-identity
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: ec_identity
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    networks:
      - app_ecommerce_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d ec_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_identity:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce-pgbouncer-identity
    environment:
      DB_HOST: postgres_identity
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: ec_identity
      AUTH_TYPE: scram-sha-256
      POOL_MODE: session
    ports:
      - "6432:5432"
    networks:
      - app_ecommerce_network
    depends_on:
      postgres_identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d ec_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-exporter-identity:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ecommerce-postgres-exporter-identity
    environment:
      DATA_SOURCE_NAME: "postgresql://DRAGON:DRAGON@postgres_identity:5432/ec_identity?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - app_ecommerce_network
    depends_on:
      postgres_identity:
        condition: service_healthy

  postgres_merchant:
    image: postgres:17-alpine
    container_name: ecommerce-postgres-merchant
