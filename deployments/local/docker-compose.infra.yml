      retries: 5
      start_period: 10s

  pgbouncer_merchant:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce-pgbouncer-merchant
    environment:
      DB_HOST: postgres_merchant
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
