  postgres-exporter-catalog:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ecommerce-postgres-exporter-catalog
    environment:
      DATA_SOURCE_NAME: "postgresql://DRAGON:DRAGON@postgres_catalog:5432/ec_catalog?sslmode=disable"
    ports:
      - "9189:9187"
    networks:
      - app_ecommerce_network
    depends_on:
