    networks:
      - app_ecommerce_network
    depends_on:
      postgres_catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d ec_catalog"]
