      review_detail:
        condition: service_started
      stats_reader:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - GRPC_STATS_READER_ADDR=stats_reader:50070

